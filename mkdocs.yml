---
site_name: Eye of Discipline
site_description: Managing your discipline policies
site_url: https://eye-of-discipline.github.io/eye-of-discipline/
repo_url: https://github.com/eye-of-discipline/eye-of-discipline
repo_name: eye-of-discipline
edit_uri: edit/main/

docs_dir: .
site_dir: site

extra:
  version:
    provider: mike
    default: latest

theme:
  name: material
  language: pl
  logo: docs/logo.png
  features:
    - navigation.tabs
    - navigation.instant
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Tryb jasny
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Tryb ciemny

extra_css:
  - stylesheets/extra.css

plugins:
  - offline
  - same-dir
  - search
  - meta
  - tags

validation:
  omitted_files: ignore


exclude_docs: |
  /README.md
  CLAUDE.md
  CODE_OF_CONDUCT.md
  CONTRIBUTING.md


markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - javascripts/tablesort.js

nav:
  - Home:
      - index.md
      - Roles: docs/roles.md
      - Glossary: docs/glossary.md
      - Creating Standards:
          - How to Write Standards?: docs/how_to_write_standards.md
          - Creating a Documentation Domain: docs/standard_domain_documentation.md
          - BCP 14 Normative Language: docs/bcp14_standard_language.md
          - Writing Documentation: docs/writing_standard_documentation.md
          - Writing a Standard Check: docs/writing_standard_check.md
      - Changelog: CHANGELOG.md
  - Discipline Rules:
      - Repository:
          - standards/repository/STD-REPO-001/README.md
          - standards/repository/STD-REPO-002/README.md
          - standards/repository/STD-REPO-003/README.md
      - Changelog: CHANGELOG.md
  - Tags: docs/tags.md
  - Dashboard: docs/dashboard.md
