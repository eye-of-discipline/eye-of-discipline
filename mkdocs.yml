---
site_name: Eye of Discipline
site_description: Managing your discipline policies
site_url: https://eye-of-discipline.github.io
repo_url: https://github.com/eye-of-discipline/eye-of-discipline
repo_name: eye-of-discipline
edit_uri: edit/main/

docs_dir: .
site_dir: site

extra:
  alternate:
    - name: English
      link: /en/ 
      lang: en
    - name: Polski
      link: /pl/
      lang: pl
  version:
    provider: mike
    default: latest

theme:
  name: material
  language: en
  logo: docs/logo.png
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: dark mode

extra_css:
  - stylesheets/extra.css

validation:
  omitted_files: ignore

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - javascripts/tablesort.js

plugins:
  - material/offline
  - same-dir
  - search
  - material/tags
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: pl
          name: Polski
          build: true
          nav_translations:
            Home: Strona główna
            Roles: Role
            Glossary: Słownik pojęć
            Creating Standards: Tworzenie norm
            Discipline Rules: Zasady Dyscypliny
            Standards development process: Proces wytwórczy standardów
            Sample pipeline: Przykładowy pipeline

nav:
  - Home:
    - index.md
    - Roles: docs/roles.md
    - Glossary: docs/glossary.md
    - Creating Standards:
      - docs/creating_standards/how_to_write_standards.md
      - docs/creating_standards/standard_domain_documentation.md
      - docs/creating_standards/bcp14_standard_language.md
      - docs/creating_standards/writing_standard_documentation.md
      - docs/creating_standards/writing_standard_check.md
    - Standards development process:
      - docs/creative_process/creative_process.md
      - bin/tools/discipline_create_domain.md
      - bin/tools/discipline_create_standard.md
      - bin/creative_process/generate_checks_jobs.md
      - bin/creative_process/stamp_standard_metadata.md
      - Sample pipeline:
        - docs/creative_process/pipeline.md
        - docs/creative_process/github/creative-process.md
        - docs/creative_process/gitlab/creative-process.md
    - Changelog: CHANGELOG.md
  - Discipline Rules:
      - Repository:
          - standards/repository/STD-REPO-001/README.md
      - Changelog: CHANGELOG.md
  - Tags: docs/tags.md
