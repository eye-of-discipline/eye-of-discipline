name: Creative process

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  set-version:
    name: 🕵 Set Version
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/eye-of-discipline/image-semantic-release:1.0.0
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    env:
      GIT_DEPTH: "0"
      GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
    outputs:
      release-candidate-version: ${{ steps.semantic-release.outputs.release-candidate-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Calculate release candidate version
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

          if [ ! -d .git ]; then
            git init
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git fetch --force --tags --prune origin \
              "+refs/heads/*:refs/remotes/origin/*" \
              "+refs/tags/*:refs/tags/*"
            git checkout --force "${GITHUB_SHA}"
          fi

          git fetch --force --tags --prune origin
          git status --short --branch

          echo "🚀 Semantic release"
          echo "   Using 'semantic-release' from https://github.com/semantic-release"

          semantic-release --dry-run

          cat versioning.env
          . ./versioning.env
          echo "release-candidate-version=${RELEASE_CANDIDATE_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Upload versioning environment
        uses: actions/upload-artifact@v7
        with:
          name: versioning-env
          path: versioning.env
          retention-days: 1

  build:
    name: 🏗️ MkDocs build
    runs-on: ubuntu-latest
    needs: set-version
    if: needs.set-version.result == 'success' && !startsWith(github.ref, 'refs/tags/')
    container:
      image: ghcr.io/eye-of-discipline/image-mkdocs:1.1.0
    env:
      DISABLE_MKDOCS_2_WARNING: "true"
      PAGES_BRANCH: "gh-pages"
      DOCS_VERSION: ${{ needs.set-version.outputs.release-candidate-version }}
      RELEASE_CANDIDATE_VERSION: ${{ needs.set-version.outputs.release-candidate-version }}
      CI_COMMIT_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download versioning environment
        uses: actions/download-artifact@v7
        with:
          name: versioning-env

      - name: Build MkDocs site
        run: |
          if [ -f versioning.env ]; then
            . ./versioning.env
          fi
          DOCS_VERSION="${DOCS_VERSION:-${RELEASE_CANDIDATE_VERSION:-}}"

          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin "${PAGES_BRANCH}:${PAGES_BRANCH}" 2>/dev/null || true

          if [ -f ./bin/prepare_build ]; then
            chmod +x ./bin/prepare_build
            ./bin/prepare_build
          fi

          mike deploy "${DOCS_VERSION}" latest \
            --push \
            --update-aliases \
            -b "${PAGES_BRANCH}" \
            -m "chore: deploy version ${DOCS_VERSION}" \
            --ignore-remote-status

          mike set-default --push "${DOCS_VERSION}" \
            -b "${PAGES_BRANCH}" \
            -m "chore: set default latest version ${DOCS_VERSION}"

          mkdir -p public
          git archive "${PAGES_BRANCH}" | tar -xC public/

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v7
        with:
          name: public
          path: public/
          retention-days: 1

  publish-version:
    name: 📍 Publish Version
    runs-on: ubuntu-latest
    needs:
      - set-version
      - build
    if: needs.set-version.result == 'success' && needs.build.result == 'success' && !startsWith(github.ref, 'refs/tags/')
    container:
      image: ghcr.io/eye-of-discipline/image-semantic-release:1.0.0
    env:
      GIT_DEPTH: "0"
      GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
      RELEASE_CANDIDATE_VERSION: ${{ needs.set-version.outputs.release-candidate-version }}
      CI_COMMIT_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download versioning environment
        uses: actions/download-artifact@v7
        with:
          name: versioning-env

      - name: Download MkDocs artifact
        uses: actions/download-artifact@v7
        with:
          name: public
          path: public

      - name: Publish version
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

          if [ ! -d .git ]; then
            git init
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git fetch --force --tags --prune origin \
              "+refs/heads/*:refs/remotes/origin/*" \
              "+refs/tags/*:refs/tags/*"
            git checkout --force "${GITHUB_SHA}"
          fi

          git fetch --force --tags --prune origin

          if [ -f versioning.env ]; then
            . ./versioning.env
          fi

          if [ -f ci/gitlab/creative-process/.releaserc.cjs ]; then
            cp ci/gitlab/creative-process/.releaserc.cjs .releaserc.cjs
          fi

          echo "🚀 Semantic release"
          echo "   Using 'semantic-release' from https://github.com/semantic-release"

          semantic-release
