name: Deploy versioned documentation

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Deploy version with mike
        run: |
          docker run --rm \
            -e RAW_VERSION="${RAW_VERSION}" \
            -e GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            -w "${GITHUB_WORKSPACE}" \
            ghcr.io/eye-of-discipline/image-mkdocs:1.1.0 \
            sh -c '
              set -eu
              VERSION="${RAW_VERSION#v}"
              git config --global --add safe.directory "${GITHUB_WORKSPACE}"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              mike deploy --push --update-aliases "${VERSION}" latest
              mike set-default --push latest
            '
